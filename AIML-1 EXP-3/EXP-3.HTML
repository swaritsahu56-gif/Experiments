<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM manipulation</title>
    <style>
        .main{
            text-align: center;
            margin-top: 50px;
            border: 5px solid black;
            height: auto;
            width: auto;
            margin-left: left;
            border-radius: 2%;
        }
        #mainheading{
            color: rgb(0, 89, 255);
        }
        #paragraph{
            font-size: 16px;
        }
        button{
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover{
            background-color: rgb(0, 89, 255);
            color: white;
        }
        #userinput{
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    


    </style>

</head>
<body>
    <div class="main">
    <h2 id="mainheading">
        <span id="demo"></span>
       <u> Welcome to JavaScript Lab</u>
    </h2>
    <br>
    <br>
   
    <input type="text" id="userinput" placeholder="Enter your name">
    <div class ="buttons">
    <button id="changetextbtn">CHANGE TEXT</button>
    <button id="bgcolorbtn">CHANGE BACKGROUND</button>
    <button id="fontsizebtn">Increase Font Size</button>
    <button id="toggleparabtn">Show or Hide Paragraph</button>
    <button id="resetbtn">Reset</button>
    </div>
    <p id ="paragraph">This is a paragraph. </p>
        </div>
 <script src="./EXP-3.js"></script>
</body>
</html>
